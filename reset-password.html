<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Abre Revs para cambiar tu contraseña de forma segura.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Recuperar contraseña · Revs</title>
    <link rel="stylesheet" href="revs-legal.css">
  </head>
  <body>
    <main class="recovery-shell">
      <p class="eyebrow">Revs</p>
      <h1>Recuperar contraseña</h1>
      <p id="recovery-message">
        Estamos abriendo Revs para que puedas elegir una contraseña nueva.
      </p>

      <div class="card recovery-card">
        <a id="open-revs" class="primary-action" href="#" hidden>
          Abrir Revs
        </a>
        <p id="recovery-help" class="updated" hidden>
          Si la app no se abre automáticamente, pulsa el botón. Debes tener
          instalada la última versión de Revs en este dispositivo.
        </p>
      </div>

      <noscript>
        Necesitas activar JavaScript para abrir de forma segura este enlace en
        la aplicación Revs.
      </noscript>
      <footer>© 2026 Daniel Uría Fernández · Revs</footer>
    </main>

    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        const hasRecoveryPayload =
          query.has('code') ||
          query.has('error') ||
          query.has('error_code') ||
          window.location.hash.includes('access_token=');
        const message = document.getElementById('recovery-message');
        const button = document.getElementById('open-revs');
        const help = document.getElementById('recovery-help');

        if (!hasRecoveryPayload) {
          message.textContent =
            'Este enlace no es válido o ya ha caducado. Solicita uno nuevo desde Revs.';
          return;
        }

        const appUrl = new URL('com.revs3.revs3app://login-callback/');
        appUrl.search = window.location.search;
        appUrl.hash = window.location.hash;
        button.href = appUrl.toString();
        button.hidden = false;
        help.hidden = false;

        // Remove the one-time recovery credentials from browser history while
        // keeping them in the in-memory app link used by the button below.
        window.history.replaceState(null, document.title, window.location.pathname);

        // Keep the visible HTTPS page as a fallback when the browser blocks
        // automatic custom-scheme navigation or Revs is not installed.
        window.setTimeout(() => window.location.assign(appUrl.toString()), 250);
      })();
    </script>
  </body>
</html>
